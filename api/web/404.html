<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Pagina no encontrada | Last Mile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; max-width: 420px; padding: 40px; }
    .code { font-size: 120px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .title { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
    .desc { font-size: 14px; color: #8a8a9a; margin-bottom: 28px; }
    .btn { display: inline-block; padding: 10px 24px; background: #6366f1; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: background 0.2s; }
    .btn:hover { background: #5558e6; }
    .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📦</div>
    <div class="code">404</div>
    <div class="title">Pagina no encontrada</div>
    <div class="desc">La ruta que buscas no existe o fue movida. Verifica la URL o regresa al inicio.</div>
    <a href="/" class="btn">Ir al Inicio</a>
  </div>
</body>
</html>
