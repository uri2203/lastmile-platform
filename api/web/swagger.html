<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Mile API - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; }
    .topbar { display: none; }
    .swagger-ui .info .title { font-size: 1.8em; }
    .swagger-ui .scheme-container { background: #f7f7f7; border-bottom: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: '/api/docs',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: 'list',
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true
      });
      window.ui = ui;
    };
  </script>
  <script src="js/cookie-consent.js"></script>
  <div style="text-align:center; padding:1rem; color:#666; font-size:0.75rem; border-top:1px solid #eee; margin-top:2rem;">
    <a href="/legal/terminos-condiciones.html" target="_blank" style="color:#666;text-decoration:none;margin:0 0.5rem;">Terminos y Condiciones</a> |
    <a href="/legal/aviso-privacidad.html" target="_blank" style="color:#666;text-decoration:none;margin:0 0.5rem;">Aviso de Privacidad</a> |
    <a href="/legal/politica-cookies.html" target="_blank" style="color:#666;text-decoration:none;margin:0 0.5rem;">Politica de Cookies</a> |
    <a href="/legal/politica-cobros-reembolsos.html" target="_blank" style="color:#666;text-decoration:none;margin:0 0.5rem;">Politica de Cobros</a> |
    <a href="/legal/deslinde-responsabilidades.html" target="_blank" style="color:#666;text-decoration:none;margin:0 0.5rem;">Deslinde</a> |
    <a href="/legal/politica-ia.html" target="_blank" style="color:#666;text-decoration:none;margin:0 0.5rem;">Politica de IA</a>
  </div>
</body>
</html>
