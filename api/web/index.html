<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Mile Delivery - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/theme.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: -48px;
      right: 0;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      background: var(--accent-bg);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .login-brand h1 {
      font-size: var(--font-xl);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: var(--font-sm);
      color: var(--text-muted);
    }

    .login-card .form-group {
      margin-bottom: 18px;
    }

    .login-card .form-label {
      margin-bottom: 6px;
    }

    .login-card .input,
    .login-card select {
      height: 40px;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: var(--font-sm);
    }

    .remember-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .remember-row a {
      font-size: var(--font-sm);
      color: var(--accent);
    }

    .btn-login {
      width: 100%;
      height: 42px;
      font-size: var(--font-base);
      font-weight: 600;
      border-radius: var(--radius-md);
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: var(--font-xs);
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--accent);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px;
      }
      .theme-toggle {
        top: -44px;
        right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <button class="theme-toggle" title="Cambiar tema"><i class="fas fa-sun"></i></button>

    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="fas fa-truck-fast"></i>
        </div>
        <h1>Last Mile Delivery</h1>
        <p>Sistema de Gestión de Entregas</p>
      </div>

      <div class="form-group">
        <label class="form-label">Empresa</label>
        <select id="login-empresa">
          <option value="1">DELIVERY EXPRESS MX</option>
          <option value="2">TRANSPORTE RAPIDO SA</option>
          <option value="3">LOGISTICA INTEGRAL MX</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input type="text" id="login-user" value="admin" placeholder="Tu usuario">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="login-pass" value="admin123" placeholder="Tu contraseña">
      </div>

      <div class="form-group">
        <label class="form-label">Panel</label>
        <select id="login-panel">
          <option value="panel-operacion.html">Panel de Operación</option>
          <option value="panel-admin.html">Panel Administrativo</option>
          <option value="panel-chofer.html">Panel Chofer</option>
          <option value="panel-cliente.html">Portal Cliente</option>
        </select>
      </div>

      <div class="remember-row">
        <label>
          <input type="checkbox" id="remember-me" checked>
          Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn btn-primary btn-login" onclick="doLogin()">
        <i class="fas fa-arrow-right-to-bracket"></i>
        Iniciar Sesión
      </button>

      <div class="login-footer">
        v1.0.0 &middot; Multi-tenant SaaS &middot; <a href="onboarding.html">Crear empresa</a>
      </div>
    </div>
  </div>

  <script>
    function doLogin() {
      const empId = document.getElementById('login-empresa').value;
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const panel = document.getElementById('login-panel').value;
      const remember = document.getElementById('remember-me').checked;

      if (!user || !pass) {
        Utils.toast('Por favor ingresa tu usuario y contraseña', 'warning');
        return;
      }

      localStorage.setItem('empId', empId);
      localStorage.setItem('user', user);
      if (remember) {
        localStorage.setItem('lm-emp-id', empId);
      }
      window.location.href = panel;
    }

    document.getElementById('login-pass').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
