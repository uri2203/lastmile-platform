<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Mile Delivery - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="/js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: -48px;
      right: 0;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      background: var(--accent-bg);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .login-brand h1 {
      font-size: var(--font-xl);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: var(--font-sm);
      color: var(--text-muted);
    }

    .login-card .form-group {
      margin-bottom: 18px;
    }

    .login-card .form-label {
      margin-bottom: 6px;
    }

    .login-card .input {
      height: 40px;
    }

    .login-error {
      background: #dc262615;
      border: 1px solid #dc262640;
      color: #ef4444;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: var(--font-sm);
      margin-bottom: 16px;
      display: none;
    }

    .login-error i {
      margin-right: 6px;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: var(--font-sm);
    }

    .remember-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .remember-row a {
      font-size: var(--font-sm);
      color: var(--accent);
    }

    .btn-login {
      width: 100%;
      height: 42px;
      font-size: var(--font-base);
      font-weight: 600;
      border-radius: var(--radius-md);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: var(--font-xs);
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--accent);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px;
      }
      .theme-toggle {
        top: -44px;
        right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div style="display:flex;align-items:center;gap:8px;position:absolute;top:-48px;right:0">
      <select id="lang-select" onchange="window.i18n.setLanguage(this.value);location.reload()" style="background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:4px 8px;font-size:var(--font-xs);cursor:pointer;">
        <option value="es">🇲🇽 ES</option>
        <option value="en">🇺🇸 EN</option>
        <option value="pt">🇧🇷 PT</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
        <option value="zh">🇨🇳 ZH</option>
        <option value="ja">🇯🇵 JA</option>
        <option value="ko">🇰🇷 KO</option>
        <option value="ar">🇸🇦 AR</option>
        <option value="hi">🇮🇳 HI</option>
        <option value="it">🇮🇹 IT</option>
        <option value="nl">🇳🇱 NL</option>
      </select>
      <button class="theme-toggle" data-i18n-title="cliente.cambiar_tema" title="Cambiar tema"><i class="fas fa-sun"></i></button>
    </div>

    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="fas fa-truck-fast"></i>
        </div>
        <h1>Last Mile Delivery</h1>
        <p data-i18n="login.subtitle">Sistema de Gestión de Entregas</p>
      </div>

      <div class="login-error" id="login-error">
        <i class="fas fa-exclamation-circle"></i>
        <span id="login-error-text"></span>
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="login.usuario">Usuario</label>
        <input type="text" id="login-user" data-i18n-placeholder="login.usuario_ph" placeholder="Tu usuario" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="login.contrasena">Contraseña</label>
        <input type="password" id="login-pass" data-i18n-placeholder="login.contrasena_ph" placeholder="Tu contraseña" autocomplete="current-password">
      </div>

      <div class="remember-row">
        <label>
          <input type="checkbox" id="remember-me">
          <span data-i18n="login.recordarme">Recordarme</span>
        </label>
        <a href="#" data-i18n="login.olvidaste">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn btn-primary btn-login" id="btn-login" onclick="doLogin()">
        <i class="fas fa-arrow-right-to-bracket"></i>
        <span data-i18n="login.btn_entrar">Iniciar Sesión</span>
      </button>

      <div class="login-footer">
        <span data-i18n="login.v3">v3.0.0</span> &middot; <a href="/terminos" data-i18n="login.terminos">Términos</a> &middot; <a href="/privacidad" data-i18n="login.privacidad">Privacidad</a> &middot; <a href="/pagos" data-i18n="login.pagos_link">Pagos</a> &middot; <a href="/privacidad-eeuu">Privacidad EE.UU.</a> &middot; <a href="/deslinde" data-i18n="login.deslinde">Deslinde</a> &middot; <a href="/sla">SLA</a> &middot; <a href="/cookies">Cookies</a> &middot; <a href="/regulaciones-ia">IA</a> &middot; <a href="/proteccion-datos">Proteccion de Datos</a> &middot; <a href="/register" data-i18n="login.crear_cuenta">Crear cuenta</a>
      </div>
    </div>
  </div>

  <script>
    window.i18n.init().then(() => {
      const sel = document.getElementById('lang-select');
      if (sel) sel.value = window.i18n.lang;
    });

    function showError(msg) {
      const el = document.getElementById('login-error');
      document.getElementById('login-error-text').textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('login-error').style.display = 'none';
    }

    function doLogin() {
      hideError();
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      const remember = document.getElementById('remember-me').checked;

      if (!user || !pass) {
        showError(window.i18n.t('login.error_vacios'));
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + window.i18n.t('login.verificando');

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: user, pass: pass })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success && data.data) {
          const d = data.data;
          sessionStorage.setItem('lm_token', data.token || '');
          if (data.refresh_token) {
            localStorage.setItem('lm_refresh_token', data.refresh_token);
          }
          localStorage.setItem('empId', d.emp_id);
          localStorage.setItem('empNombre', d.empresa || '');
          localStorage.setItem('user', d.usuario || user);
          localStorage.setItem('rol', d.rol || 'operacion');
          localStorage.setItem('empId_ts', Date.now());

          if (remember) {
            localStorage.setItem('lm_remember_user', user);
          } else {
            localStorage.removeItem('lm_remember_user');
          }

          const panels = {
            'admin': 'panel-admin.html',
            'operacion': 'panel-operacion.html',
            'chofer': 'panel-chofer.html',
            'cliente': 'panel-cliente.html'
          };
          const redirect = panels[d.rol] || 'panel-operacion.html';
          window.location.href = redirect;
        } else {
          showError(data.error || window.i18n.t('login.error_creds'));
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> ' + window.i18n.t('login.btn_entrar');
        }
      })
      .catch(err => {
        showError(window.i18n.t('login.error_server'));
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> ' + window.i18n.t('login.btn_entrar');
      });
    }

    document.getElementById('login-pass').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('login-user').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-pass').focus();
    });

    const savedUser = localStorage.getItem('lm_remember_user');
    if (savedUser) {
      document.getElementById('login-user').value = savedUser;
      document.getElementById('remember-me').checked = true;
      document.getElementById('login-pass').focus();
    }

    document.addEventListener('DOMContentLoaded', () => ThemeManager.init());
  </script>
  <script src="js/cookie-consent.js"></script>
</body>
</html>
