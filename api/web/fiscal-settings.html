<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuracion Fiscal Multi-Pais | Last Mile Delivery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 20px 30px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.4rem; }
        .header .lang-selector { display: flex; gap: 8px; }
        .header .lang-btn { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .header .lang-btn.active { background: #ff6b35; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
        .card h2 { color: #1a1a2e; margin-bottom: 16px; font-size: 1.15rem; border-bottom: 2px solid #ff6b35; padding-bottom: 8px; }
        .country-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .country-card { border: 2px solid #e0e0e0; border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .country-card:hover { border-color: #ff6b35; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,107,53,0.2); }
        .country-card.selected { border-color: #ff6b35; background: #fff5f0; }
        .country-card .flag { font-size: 2rem; margin-bottom: 8px; }
        .country-card .name { font-weight: 600; color: #1a1a2e; }
        .country-card .currency { font-size: 0.8rem; color: #666; margin-top: 4px; }
        .country-card .provider { font-size: 0.75rem; color: #ff6b35; margin-top: 2px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #ff6b35; color: white; }
        .btn-primary:hover { background: #e55a2b; }
        .btn-secondary { background: #1a1a2e; color: white; }
        .btn-secondary:hover { background: #16213e; }
        .btn-test { background: #27ae60; color: white; }
        .btn-test:hover { background: #219a52; }
        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        .status-box { padding: 12px; border-radius: 6px; margin-top: 12px; display: none; }
        .status-box.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-box.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-box.info { display: block; background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .payment-methods { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .payment-tag { background: #f0f0f0; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; color: #555; }
        .payment-tag.stripe { background: #635bff20; color: #635bff; }
        .payment-tag.mercadopago { background: #009ee320; color: #009ee3; }
        .hidden { display: none; }
        @media (max-width: 600px) { .country-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1 data-i18n="fiscal.title">Configuracion Fiscal Multi-Pais</h1>
        <div class="lang-selector">
            <button class="lang-btn" data-lang="es" onclick="switchLang('es')">🇲🇽 ES</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">🇺🇸 EN</button>
            <button class="lang-btn" data-lang="pt" onclick="switchLang('pt')">🇧🇷 PT</button>
            <button class="lang-btn" data-lang="fr" onclick="switchLang('fr')">🇫🇷 FR</button>
            <button class="lang-btn" data-lang="de" onclick="switchLang('de')">🇩🇪 DE</button>
            <button class="lang-btn" data-lang="zh" onclick="switchLang('zh')">🇨🇳 ZH</button>
            <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">🇯🇵 JA</button>
            <button class="lang-btn" data-lang="ko" onclick="switchLang('ko')">🇰🇷 KO</button>
            <button class="lang-btn" data-lang="ar" onclick="switchLang('ar')">🇸🇦 AR</button>
            <button class="lang-btn" data-lang="hi" onclick="switchLang('hi')">🇮🇳 HI</button>
            <button class="lang-btn" data-lang="it" onclick="switchLang('it')">🇮🇹 IT</button>
            <button class="lang-btn" data-lang="nl" onclick="switchLang('nl')">🇳🇱 NL</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2 data-i18n="fiscal.country">Seleccionar Pais</h2>
            <div class="country-grid" id="countryGrid"></div>
        </div>

        <div class="card hidden" id="configSection">
            <h2 data-i18n="fiscal.provider">Proveedor Fiscal</h2>
            <div class="form-group">
                <label data-i18n="fiscal.api_key">Clave API</label>
                <input type="text" id="apiKey" placeholder="Ingrese su clave API del proveedor fiscal">
            </div>
            <div class="form-group">
                <label data-i18n="fiscal.api_secret">Clave Secreta</label>
                <input type="password" id="apiSecret" placeholder="Ingrese su clave secreta">
            </div>
            <div class="form-group">
                <label data-i18n="fiscal.base_url">URL Base (opcional)</label>
                <input type="text" id="baseUrl" placeholder="URL base de la API del proveedor">
            </div>
            <div class="btn-group">
                <button class="btn btn-test" onclick="testConnection()" data-i18n="fiscal.test_connection">Probar Conexion</button>
                <button class="btn btn-primary" onclick="saveConfig()" data-i18n="fiscal.save_config">Guardar Configuracion</button>
            </div>
            <div class="status-box" id="statusBox"></div>
        </div>

        <div class="card hidden" id="paymentSection">
            <h2>Metodos de Pago Disponibles</h2>
            <div class="payment-methods" id="paymentMethods"></div>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        const countries = [
            { code: 'MX', name: 'Mexico', flag: '🇲🇽', currency: 'MXN', provider: 'FacturAPI / MexicoProvider' },
            { code: 'BR', name: 'Brasil', flag: '🇧🇷', currency: 'BRL', provider: 'NFe.io / BrazilProvider' },
            { code: 'CO', name: 'Colombia', flag: '🇨🇴', currency: 'COP', provider: 'DIAN API / ColombiaProvider' },
            { code: 'AR', name: 'Argentina', flag: '🇦🇷', currency: 'ARS', provider: 'FiscalAPI / ArgentinaProvider' },
            { code: 'CL', name: 'Chile', flag: '🇨🇱', currency: 'CLP', provider: 'SII API / ChileProvider' },
            { code: 'PE', name: 'Peru', flag: '🇵🇪', currency: 'PEN', provider: 'SUNAT API / PeruProvider' },
            { code: 'UY', name: 'Uruguay', flag: '🇺🇾', currency: 'UYU', provider: 'DGI API / UruguayProvider' },
            { code: 'EC', name: 'Ecuador', flag: '🇪🇨', currency: 'USD', provider: 'SRI API / EcuadorProvider' },
        ];

        let selectedCountry = null;
        const API = '/api';

        function getToken() { return localStorage.getItem('lastmile_token'); }

        async function switchLang(lang) {
            window.i18n.setLanguage(lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        }

        function renderCountries() {
            const grid = document.getElementById('countryGrid');
            grid.innerHTML = countries.map(c => `
                <div class="country-card" onclick="selectCountry('${c.code}')" data-country="${c.code}">
                    <div class="flag">${c.flag}</div>
                    <div class="name">${c.name}</div>
                    <div class="currency">${c.currency}</div>
                    <div class="provider">${c.provider}</div>
                </div>
            `).join('');
        }

        async function selectCountry(code) {
            selectedCountry = countries.find(c => c.code === code);
            document.querySelectorAll('.country-card').forEach(c => c.classList.toggle('selected', c.dataset.country === code));
            document.getElementById('configSection').classList.remove('hidden');
            document.getElementById('paymentSection').classList.remove('hidden');
            loadConfig(code);
            loadPaymentMethods(code);
        }

        async function loadConfig(code) {
            try {
                const r = await fetch(`${API}/fiscal/config`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
                const d = await r.json();
                if (d.config) {
                    document.getElementById('apiKey').value = d.config.TFC_API_KEY || '';
                    document.getElementById('baseUrl').value = d.config.TFC_BASE_URL || '';
                }
            } catch (e) { console.error('Load config error:', e); }
        }

        async function loadPaymentMethods(code) {
            try {
                const r = await fetch(`${API}/payment/methods/${code}`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
                const d = await r.json();
                const el = document.getElementById('paymentMethods');
                if (d.data && d.data.length) {
                    el.innerHTML = d.data.map(m => {
                        const cls = m.PMC_PROVIDER || '';
                        return `<span class="payment-tag ${cls}">${m.PMC_METHOD_NAME}${cls ? ' (' + cls + ')' : ''}</span>`;
                    }).join('');
                } else {
                    el.innerHTML = '<span class="payment-tag">No hay metodos configurados</span>';
                }
            } catch (e) { console.error('Load payment methods error:', e); }
        }

        async function testConnection() {
            const box = document.getElementById('statusBox');
            box.className = 'status-box info';
            box.textContent = 'Probando conexion...';
            try {
                const r = await fetch(`${API}/fiscal/test-connection`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ country_code: selectedCountry.code }),
                });
                const d = await r.json();
                box.className = d.success ? 'status-box success' : 'status-box error';
                box.textContent = d.success ? `Conexion exitosa con ${d.provider}` : `Error: ${d.error}`;
            } catch (e) {
                box.className = 'status-box error';
                box.textContent = `Error de red: ${e.message}`;
            }
        }

        async function saveConfig() {
            const box = document.getElementById('statusBox');
            try {
                const r = await fetch(`${API}/fiscal/config`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        country_code: selectedCountry.code,
                        api_key: document.getElementById('apiKey').value,
                        base_url: document.getElementById('baseUrl').value,
                    }),
                });
                const d = await r.json();
                box.className = d.success ? 'status-box success' : 'status-box error';
                box.textContent = d.success ? 'Configuracion guardada exitosamente' : `Error: ${d.error}`;
            } catch (e) {
                box.className = 'status-box error';
                box.textContent = `Error: ${e.message}`;
            }
        }

        renderCountries();
        document.querySelector('.lang-btn[data-lang="es"]').classList.add('active');
    </script>
</body>
</html>
