<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuracion Fiscal - Last Mile</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .fiscal-config {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .config-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .config-card h3 {
            margin: 0 0 20px 0;
            color: #1a1a2e;
            font-size: 18px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        .btn-primary:hover {
            background: #4f46e5;
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .country-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .country-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .country-card:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }
        .country-card.selected {
            border-color: #6366f1;
            background: #6366f1;
            color: white;
        }
        .country-card .flag {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .country-card .name {
            font-weight: 500;
            font-size: 14px;
        }
        .country-card .currency {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-active {
            background: #d1fae5;
            color: #065f46;
        }
        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        .connection-test {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f4f6;
        }
        .test-result {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .test-success {
            background: #d1fae5;
            color: #065f46;
        }
        .test-error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="fiscal-config">
        <h1>Configuracion Fiscal Multi-Pais</h1>

        <div class="config-card">
            <h3>Seleccionar Pais</h3>
            <div class="country-selector" id="countrySelector">
                <div class="country-card" data-country="MX" onclick="selectCountry('MX')">
                    <div class="flag">🇲🇽</div>
                    <div class="name">Mexico</div>
                    <div class="currency">MXN - Peso</div>
                </div>
                <div class="country-card" data-country="BR" onclick="selectCountry('BR')">
                    <div class="flag">🇧🇷</div>
                    <div class="name">Brasil</div>
                    <div class="currency">BRL - Real</div>
                </div>
                <div class="country-card" data-country="CO" onclick="selectCountry('CO')">
                    <div class="flag">🇨🇴</div>
                    <div class="name">Colombia</div>
                    <div class="currency">COP - Peso</div>
                </div>
                <div class="country-card" data-country="AR" onclick="selectCountry('AR')">
                    <div class="flag">🇦🇷</div>
                    <div class="name">Argentina</div>
                    <div class="currency">ARS - Peso</div>
                </div>
                <div class="country-card" data-country="CL" onclick="selectCountry('CL')">
                    <div class="flag">🇨🇱</div>
                    <div class="name">Chile</div>
                    <div class="currency">CLP - Peso</div>
                </div>
                <div class="country-card" data-country="PE" onclick="selectCountry('PE')">
                    <div class="flag">🇵🇪</div>
                    <div class="name">Peru</div>
                    <div class="currency">PEN - Sol</div>
                </div>
                <div class="country-card" data-country="UY" onclick="selectCountry('UY')">
                    <div class="flag">🇺🇾</div>
                    <div class="name">Uruguay</div>
                    <div class="currency">UYU - Peso</div>
                </div>
                <div class="country-card" data-country="EC" onclick="selectCountry('EC')">
                    <div class="flag">🇪🇨</div>
                    <div class="name">Ecuador</div>
                    <div class="currency">USD - Dolar</div>
                </div>
            </div>
        </div>

        <div class="config-card">
            <h3>Configuracion del Proveedor</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Proveedor Fiscal</label>
                    <select id="provider" onchange="updateProviderInfo()">
                        <option value="">Seleccionar proveedor...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Modo</label>
                    <select id="testMode">
                        <option value="S">Prueba (Testing)</option>
                        <option value="N">Produccion</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>API Key</label>
                    <input type="password" id="apiKey" placeholder="Tu API Key del proveedor">
                </div>
                <div class="form-group full-width">
                    <label>API Secret</label>
                    <input type="password" id="apiSecret" placeholder="Tu API Secret del proveedor">
                </div>
                <div class="form-group full-width">
                    <label>URL Base (opcional)</label>
                    <input type="text" id="baseUrl" placeholder="URL base de la API">
                </div>
            </div>

            <div class="connection-test">
                <button class="btn btn-warning" onclick="testConnection()">Probar Conexion</button>
                <div id="testResult"></div>
            </div>
        </div>

        <div class="config-card">
            <h3>Datos Fiscales</h3>
            <div class="form-grid" id="fiscalFields">
                <!-- Dynamic fields based on country -->
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="saveConfig()">Guardar Configuracion</button>
            <button class="btn btn-secondary" onclick="window.history.back()">Cancelar</button>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/i18n.js"></script>
    <script>

        let fiscalConfig = null;

            ],
            'BR': [
                { id: 'nfeio', name: 'NFe.io', baseUrl: 'https://api.nfe.io/v1' },
                { id: 'fiscalapi', name: 'FiscalAPI', baseUrl: 'https://api.fiscalapi.com/v1' }
            ],
            'CO': [
                { id: 'validoo', name: 'Validoo', baseUrl: 'https://api.validoo.com.co/v1' },

            'UY': [
                { id: 'dgi', name: 'DGI SDK', baseUrl: 'https://api.dgi.gub.uy/v1' },
                { id: 'facturapi', name: 'FacturAPI', baseUrl: 'https://www.facturapi.io/v2' }
            ],
            'EC': [
                { id: 'sri', name: 'SRI SDK', baseUrl: 'https://api.sri.gob.ec/v1' },
                { id: 'facturapi', name: 'FacturAPI', baseUrl: 'https://www.facturapi.io/v2' }

        const COUNTRY_FIELDS = {
            'MX': [
                { id: 'rfc', label: 'RFC', placeholder: 'RFC de la empresa' },

                { id: 'regimen_fiscal', label: 'Regimen Fiscal', type: 'select', options: {

                }},
                { id: 'codigo_postal', label: 'Codigo Postal', placeholder: '06600' },
                { id: 'colonia', label: 'Colonia', placeholder: 'Colonia' },
                { id: 'calle', label: 'Calle', placeholder: 'Calle' },

                { id: 'ie', label: 'IE (Inscricao Estadual)', placeholder: 'Inscricao Estadual' },
                { id: 'im', label: 'IM (Inscricao Municipal)', placeholder: 'Inscricao Municipal' },
                { id: 'cnae', label: 'CNAE', placeholder: 'Codigo CNAE' },
                { id: 'codigo_municipio', label: 'Codigo Municipio', placeholder: '3550308' },
                { id: 'estado', label: 'Estado', placeholder: 'SP' },
                { id: 'calle', label: 'Rua', placeholder: 'Rua' },
                { id: 'numero_exterior', label: 'Numero', placeholder: '123' },
                { id: 'colonia', label: 'Bairro', placeholder: 'Bairro' },
                { id: 'cep', label: 'CEP', placeholder: '01310-100' },
                { id: 'telefono', label: 'Telefone', placeholder: '(11) 1234-5678' },
                { id: 'email_fiscal', label: 'Email Fiscal', placeholder: 'fiscal@empresa.com.br' }
            ],
            'CO': [
                { id: 'nit', label: 'NIT', placeholder: '900123456-7' },
                { id: 'razon_social', label: 'Razon Social', placeholder: 'Nombre de la empresa' },
                { id: 'regimen_fiscal', label: 'Regimen Tributario', type: 'select', options: {
                    '48': 'General',
                    '49': 'Simplificado'
                }},
                { id: 'direccion', label: 'Direccion', placeholder: 'Direccion completa' },
                { id: 'ciudad', label: 'Ciudad', placeholder: 'Bogota D.C.' },
                { id: 'estado', label: 'Departamento', placeholder: 'Bogota D.C.' },
                { id: 'telefono', label: 'Telefono', placeholder: '(601) 123 4567' },
                { id: 'email_fiscal', label: 'Email Fiscal', placeholder: 'facturacion@empresa.com.co' }
            ],
            'AR': [
                { id: 'cuit', label: 'CUIT', placeholder: '30-71234567-9' },
                { id: 'razon_social', label: 'Razon Social', placeholder: 'Nombre de la empresa' },
                { id: 'condicion_iva', label: 'Condicion IVA', type: 'select', options: {
                    'RI': 'Responsable Inscripto',
                    'CF': 'Consumidor Final',
                    'MI': 'Monotributo',
                    'EX': 'Exento'
                }},
                { id: 'condicion_ingresos_brutos', label: 'Condicion IIBB', placeholder: 'Condicion Ingresos Brutos' },
                { id: 'domicilio', label: 'Domicilio', placeholder: 'Domicilio fiscal' },
                { id: 'telefono', label: 'Telefono', placeholder: '(011) 1234-5678' },
                { id: 'email_fiscal', label: 'Email Fiscal', placeholder: 'facturacion@empresa.com.ar' }
            ],
            'CL': [
                { id: 'rut', label: 'RUT', placeholder: '12.345.678-9' },
                { id: 'razon_social', label: 'Razon Social', placeholder: 'Nombre de la empresa' },

                { id: 'comuna', label: 'Comuna', placeholder: 'Santiago' },
                { id: 'ciudad', label: 'Ciudad', placeholder: 'Santiago' },

                { id: 'telefono', label: 'Telefono', placeholder: '+51 1 123 4567' },
                { id: 'email_fiscal', label: 'Email Fiscal', placeholder: 'facturacion@empresa.pe' }
            ],
            'UY': [
                { id: 'rut', label: 'RUT', placeholder: '211234560012' },
                { id: 'razon_social', label: 'Razon Social', placeholder: 'Nombre de la empresa' },
                { id: 'giro', label: 'Giro', placeholder: 'Giro del negocio' },
                { id: 'departamento', label: 'Departamento', placeholder: 'Montevideo' },
                { id: 'ciudad', label: 'Ciudad', placeholder: 'Montevideo' },
                { id: 'direccion', label: 'Direccion', placeholder: 'Direccion completa' },
                { id: 'telefono', label: 'Telefono', placeholder: '+598 2 123 4567' },
                { id: 'email_fiscal', label: 'Email Fiscal', placeholder: 'facturacion@empresa.uy' }
            ],
            'EC': [
                { id: 'ruc', label: 'RUC', placeholder: '0123456789001' },
                { id: 'razon_social', label: 'Razon Social', placeholder: 'Nombre de la empresa' },
                { id: 'contribuyente_especial', label: 'Contribuyente Especial', placeholder: '1234' },
                { id: 'obligado_contabilidad', label: 'Obligado a Contabilidad', type: 'select', options: {
                    'SI': 'Si',
                    'NO': 'No'
                }},
                { id: 'provincia', label: 'Provincia', placeholder: 'Guayas' },
                { id: 'ciudad', label: 'Ciudad', placeholder: 'Guayaquil' },
                { id: 'direccion', label: 'Direccion', placeholder: 'Direccion completa' },
                { id: 'telefono', label: 'Telefono', placeholder: '+593 4 123 4567' },
                { id: 'email_fiscal', label: 'Email Fiscal', placeholder: 'facturacion@empresa.ec' }
            ]
        };

        function selectCountry(country) {
            selectedCountry = country;
            document.querySelectorAll('.country-card').forEach(card => {
                card.classList.remove('selected');
                if (card.dataset.country === country) {
                    card.classList.add('selected');
                }
            });
            updateProviderList();
            updateFiscalFields();
        }

        function updateProviderList() {
            const providerSelect = document.getElementById('provider');
            const providers = COUNTRY_PROVIDERS[selectedCountry] || [];

            providerSelect.innerHTML = '<option value="">Seleccionar proveedor...</option>';
            providers.forEach(provider => {
                providerSelect.innerHTML += `<option value="${provider.id}" data-base-url="${provider.baseUrl}">${provider.name}</option>`;
            });
        }

        function updateProviderInfo() {
            const providerSelect = document.getElementById('provider');
            const selected = providerSelect.options[providerSelect.selectedIndex];
            const baseUrl = selected.dataset.baseUrl || '';
            document.getElementById('baseUrl').value = baseUrl;
        }

        function updateFiscalFields() {
            const fieldsContainer = document.getElementById('fiscalFields');
            const fields = COUNTRY_FIELDS[selectedCountry] || [];

            fieldsContainer.innerHTML = '';
            fields.forEach(field => {
                const div = document.createElement('div');
                div.className = `form-group ${field.fullWidth ? 'full-width' : ''}`;

                let inputHtml = '';
                if (field.type === 'select') {
                    const options = Object.entries(field.options).map(([value, label]) =>
                        `<option value="${value}">${label}</option>`
                    ).join('');
                    inputHtml = `<select id="${field.id}">${options}</select>`;
                } else {
                    inputHtml = `<input type="text" id="${field.id}" placeholder="${field.placeholder || ''}">`;
                }

                div.innerHTML = `<label>${field.label}</label>${inputHtml}`;
                fieldsContainer.appendChild(div);
            });
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/fiscal/config', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('lastmile_token')}` }
                });
                const data = await response.json();

                if (data.success) {
                    fiscalConfig = data;
                    if (data.config) {
                        selectedCountry = data.config.TFC_COUNTRY_CODE || 'MX';
                        selectCountry(selectedCountry);
                        document.getElementById('provider').value = data.config.TFC_PROVIDER || '';
                        document.getElementById('testMode').value = data.config.TFC_TEST_MODE || 'S';
                        document.getElementById('apiKey').value = data.config.TFC_API_KEY || '';
                        document.getElementById('apiSecret').value = data.config.TFC_API_SECRET || '';
                        document.getElementById('baseUrl').value = data.config.TFC_BASE_URL || '';
                    }
                    if (data.fiscal_data) {
                        Object.keys(data.fiscal_data).forEach(key => {
                            if (key.startsWith('TFD_')) {
                                const fieldId = key.replace('TFD_', '').toLowerCase();
                                const element = document.getElementById(fieldId);
                                if (element) {
                                    element.value = data.fiscal_data[key] || '';
                                }
                            }
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        async function testConnection() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<div class="test-result">Probando conexion...</div>';

            try {
                const response = await fetch('/api/fiscal/test', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('lastmile_token')}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = '<div class="test-result test-success">Conexion exitosa</div>';
                } else {
                    resultDiv.innerHTML = `<div class="test-result test-error">Error: ${data.error || 'No se pudo conectar'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="test-result test-error">Error: ${error.message}</div>`;
            }
        }

        async function saveConfig() {
            const fields = COUNTRY_FIELDS[selectedCountry] || [];
            const fiscalData = {};

            fields.forEach(field => {
                const element = document.getElementById(field.id);
                if (element) {
                    fiscalData[field.id] = element.value;
                }
            });

            try {
                const configResponse = await fetch('/api/fiscal/config', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('lastmile_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        country_code: selectedCountry,
                        provider: document.getElementById('provider').value,
                        api_key: document.getElementById('apiKey').value,
                        api_secret: document.getElementById('apiSecret').value,
                        base_url: document.getElementById('baseUrl').value,
                        test_mode: document.getElementById('testMode').value
                    })
                });

                const dataResponse = await fetch('/api/fiscal/data', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('lastmile_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(fiscalData)
                });

                const configResult = await configResponse.json();
                const dataResult = await dataResponse.json();

                if (configResult.success && dataResult.success) {
                    alert('Configuracion guardada exitosamente');
                } else {
                    alert('Error al guardar: ' + (configResult.error || dataResult.error));
                }
            } catch (error) {
                alert('Error al guardar: ' + error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
        });
    </script>
</body>
</html>
