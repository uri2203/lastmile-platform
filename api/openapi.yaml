openapi: 3.0.3
info:
  title: Last Mile Delivery Platform API
  description: |
    API REST para la plataforma SaaS de last mile delivery multi-pais.
    Multi-tenant con autenticacion JWT, facturacion fiscal multi-pais (MX/BR/CO/AR/CL/PE/UY/EC),
    pagos Stripe/MercadoPago, i18n (ES/EN/PT), notificaciones multi-idioma, PWA chofer.
  version: 4.0.0
  contact:
    name: Last Mile Support
    email: soporte@lastmile.mx
  license:
    name: Proprietary

servers:
  - url: https://lastmile-platform.onrender.com
    description: Production
  - url: http://localhost:8080
    description: Development

tags:
  - name: Auth
    description: Autenticacion y tokens
  - name: Health
    description: Health checks
  - name: Pedidos
    description: Gestion de pedidos/envios
  - name: Zonas
    description: Zonas y tarifas
  - name: Choferes
    description: Gestion de choferes
  - name: Vehiculos
    description: Gestion de vehiculos
  - name: Clientes
    description: Clientes del tenant
  - name: Billing
    description: Facturacion SaaS y planes
  - name: CFDI
    description: Facturacion electronica CFDI 4.0
  - name: Fiscal
    description: Sistema fiscal multi-pais (MX, BR, CO, AR, CL, PE, UY, EC)
  - name: Pagos
    description: Pagos y transacciones multi-pais
  - name: Webhooks
    description: Webhooks de Stripe y MercadoPago
  - name: Usuarios
    description: Gestion de usuarios del tenant
  - name: SuperAdmin
    description: Gestion global de tenants (solo superadmin)
  - name: Tracking
    description: Tracking publico para clientes finales
  - name: Referidos
    description: Sistema de referidos

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check del sistema
      security: []
      responses:
        '200':
          description: Sistema operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, pass]
              properties:
                user:
                  type: string
                  example: admin
                pass:
                  type: string
                  example: admin123
                emp_id:
                  type: integer
                  description: ID de empresa (opcional, para multi-tenant)
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refrescar access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Nuevo access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  expires_in:
                    type: integer
        '401':
          description: Refresh token invalido

  /api/pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos del tenant
      security:
        - bearerAuth: []
      parameters:
        - name: limite
          in: query
          schema:
            type: integer
            default: 100
        - name: estado
          in: query
          schema:
            type: string
            enum: [PENDIENTE, ASIGNADO, RECOGIENDO, EN_RUTA, ENTREGADO, CANCELADO]
      responses:
        '200':
          description: Lista de pedidos
    post:
      tags: [Pedidos]
      summary: Crear un pedido/envio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
      responses:
        '200':
          description: Pedido creado

  /api/pedidos/{ped_id}:
    delete:
      tags: [Pedidos]
      summary: Eliminar un pedido
      security:
        - bearerAuth: []
      parameters:
        - name: ped_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido eliminado

  /api/zonas:
    get:
      tags: [Zonas]
      summary: Listar zonas del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de zonas
    post:
      tags: [Zonas]
      summary: Crear zona
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                coordenadas:
                  type: string
      responses:
        '200':
          description: Zona creada

  /api/zonas/cotizar:
    post:
      tags: [Zonas]
      summary: Cotizar envio por zona
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zona_id:
                  type: integer
                servicio:
                  type: string
                  enum: [ESTANDAR, EXPRESS, SAME_DAY]
                peso_kg:
                  type: number
                distancia_km:
                  type: number
                valor_declarado:
                  type: number
      responses:
        '200':
          description: Cotizacion

  /api/choferes:
    get:
      tags: [Choferes]
      summary: Listar choferes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de choferes
    post:
      tags: [Choferes]
      summary: Crear chofer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoferCreate'
      responses:
        '200':
          description: Chofer creado

  /api/choferes/{cho_id}:
    delete:
      tags: [Choferes]
      summary: Eliminar chofer
      security:
        - bearerAuth: []
      parameters:
        - name: cho_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chofer eliminado

  /api/vehiculos:
    get:
      tags: [Vehiculos]
      summary: Listar vehiculos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de vehiculos
    post:
      tags: [Vehiculos]
      summary: Crear vehiculo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
      responses:
        '200':
          description: Vehiculo creado

  /api/vehiculos/{veh_id}:
    delete:
      tags: [Vehiculos]
      summary: Eliminar vehiculo
      security:
        - bearerAuth: []
      parameters:
        - name: veh_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vehiculo eliminado

  /api/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes
    post:
      tags: [Clientes]
      summary: Crear cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '200':
          description: Cliente creado

  /api/clientes/{cli_id}:
    delete:
      tags: [Clientes]
      summary: Eliminar cliente
      security:
        - bearerAuth: []
      parameters:
        - name: cli_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente eliminado

  /api/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios

  /api/usuarios/{usu_id}:
    delete:
      tags: [Usuarios]
      summary: Eliminar usuario
      security:
        - bearerAuth: []
      parameters:
        - name: usu_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado

  /api/billing/planes:
    get:
      tags: [Billing]
      summary: Listar planes disponibles
      security: []
      responses:
        '200':
          description: Lista de planes

  /api/billing/mis-limites:
    get:
      tags: [Billing]
      summary: Ver limites del plan actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Limites del tenant

  /api/billing/stats:
    get:
      tags: [Billing]
      summary: Estadisticas de uso del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadisticas

  /api/billing/webhook/stripe:
    post:
      tags: [Billing]
      summary: Webhook de Stripe (verificado por firma)
      security: []
      responses:
        '200':
          description: Webhook procesado

  /api/cfdi/status:
    get:
      tags: [CFDI]
      summary: Estado del servicio de facturacion
      security: []
      responses:
        '200':
          description: Estado CFDI

  /api/cfdi/facturas:
    get:
      tags: [CFDI]
      summary: Listar facturas emitidas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de facturas

  /api/cfdi/facturas/{fac_id}/cancelar:
    post:
      tags: [CFDI]
      summary: Cancelar factura
      security:
        - bearerAuth: []
      parameters:
        - name: fac_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
      responses:
        '200':
          description: Factura cancelada

  /api/pagos/transacciones:
    get:
      tags: [Pagos]
      summary: Listar transacciones de pago
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de transacciones

  /api/pagos/transacciones/{pag_id}:
    delete:
      tags: [Pagos]
      summary: Eliminar transaccion
      security:
        - bearerAuth: []
      parameters:
        - name: pag_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaccion eliminada

  /api/billing/cancelar:
    post:
      tags: [Billing]
      summary: Cancelar suscripcion SaaS
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suscripcion cancelada

  /api/onboarding/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo tenant con admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Tenant registrado

  /api/saas/tenants:
    get:
      tags: [SuperAdmin]
      summary: Listar todos los tenants (solo superadmin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tenants

  /api/saas/tenants/{emp_id}/suspend:
    post:
      tags: [SuperAdmin]
      summary: Suspender tenant (solo superadmin)
      security:
        - bearerAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant suspendido

  /api/saas/tenants/{emp_id}/activate:
    post:
      tags: [SuperAdmin]
      summary: Activar tenant (solo superadmin)
      security:
        - bearerAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant activado

  /api/tracking/{token}:
    get:
      tags: [Tracking]
      summary: Obtener estado del pedido por token de tracking
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del pedido

  # ===== MULTI-COUNTRY FISCAL =====
  /api/fiscal/countries:
    get:
      tags: [Fiscal]
      summary: Listar paises con soporte fiscal
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de 8 paises (MX, BR, CO, AR, CL, PE, UY, EC)

  /api/fiscal/providers:
    get:
      tags: [Fiscal]
      summary: Listar proveedores fiscales disponibles
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Proveedores con monedas

  /api/fiscal/config:
    get:
      tags: [Fiscal]
      summary: Obtener configuracion fiscal del tenant
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Configuracion fiscal
    put:
      tags: [Fiscal]
      summary: Guardar configuracion fiscal del tenant
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code]
              properties:
                country_code:
                  type: string
                  enum: [MX, BR, CO, AR, CL, PE, UY, EC]
                api_key:
                  type: string
                api_secret:
                  type: string
                base_url:
                  type: string
      responses:
        '200':
          description: Configuracion guardada

  /api/fiscal/test-connection:
    post:
      tags: [Fiscal]
      summary: Probar conexion con proveedor fiscal
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
      responses:
        '200':
          description: Resultado de prueba de conexion

  /api/fiscal/emit:
    post:
      tags: [Fiscal]
      summary: Emitir documento fiscal
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Documento emitido

  /api/fiscal/cancel:
    post:
      tags: [Fiscal]
      summary: Cancelar documento fiscal
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Documento cancelado

  /api/system/migrate:
    post:
      tags: [Fiscal]
      summary: Ejecutar migracion de tablas fiscales (admin)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Migracion ejecutada

  # ===== MULTI-COUNTRY PAYMENTS =====
  /api/payment/countries:
    get:
      tags: [Pagos]
      summary: Listar paises con metodos de pago
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de paises con pagos

  /api/payment/methods/{country_code}:
    get:
      tags: [Pagos]
      summary: Metodos de pago por pais
      security: [{bearerAuth: []}]
      parameters:
        - name: country_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metodos de pago del pais

  /api/payments/create:
    post:
      tags: [Pagos]
      summary: Crear pago multi-pais
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, country_code]
              properties:
                amount:
                  type: number
                country_code:
                  type: string
                payment_method:
                  type: string
                description:
                  type: string
                order_id:
                  type: string
      responses:
        '200':
          description: Sesion de pago creada

  /api/payments/status/{provider}/{payment_id}:
    get:
      tags: [Pagos]
      summary: Consultar estado de pago
      security: [{bearerAuth: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe, mercadopago]
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del pago

  /api/payments/refund:
    post:
      tags: [Pagos]
      summary: Reembolsar pago
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, payment_id]
              properties:
                provider:
                  type: string
                payment_id:
                  type: string
                amount:
                  type: number
      responses:
        '200':
          description: Reembolso procesado

  /api/payments/status-summary:
    get:
      tags: [Pagos]
      summary: Estado de configuracion de proveedores de pago
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Resumen de estado

  # ===== WEBHOOKS (PUBLIC - NO AUTH) =====
  /api/webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Webhook de Stripe (pagos, reembolsos, etc)
      security: []
      responses:
        '200':
          description: Evento procesado

  /api/webhooks/mercadopago:
    post:
      tags: [Webhooks]
      summary: Webhook de MercadoPago (pagos, etc)
      security: []
      responses:
        '200':
          description: Evento procesado

  # ===== ANALYTICS =====
  /api/analytics/multi-country:
    get:
      tags: [Fiscal]
      summary: Analytics multi-pais (fiscal, pagos, ordenes)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Datos analiticos multi-pais
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      countries_supported:
                        type: array
                        items:
                          type: string
                      fiscal_configured:
                        type: array
                        items:
                          type: object
                          properties:
                            country:
                              type: string
                            tenants:
                              type: integer
                      payment_methods:
                        type: array
                        items:
                          type: object
                          properties:
                            country:
                              type: string
                            methods:
                              type: integer
                      total_tenants:
                        type: integer
                      orders_by_status:
                        type: array

  # ===== REPORTES =====
  /api/reportes:
    get:
      tags: [Pedidos]
      summary: Reportes disponibles
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de reportes

  /api/reportes/generar:
    post:
      tags: [Pedidos]
      summary: Generar reporte personalizado
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo:
                  type: string
                  enum: [entregas, financiero, rendimiento, costos]
                fecha_inicio:
                  type: string
                  format: date
                fecha_fin:
                  type: string
                  format: date
      responses:
        '200':
          description: Reporte generado

  /api/reportes/entregas:
    get:
      tags: [Pedidos]
      summary: Reporte de entregas
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Datos de entregas

  /api/reportes/rendimiento-choferes:
    get:
      tags: [Choferes]
      summary: Reporte de rendimiento de choferes
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Rendimiento por chofer

  /api/reportes/costos-rutas:
    get:
      tags: [Pedidos]
      summary: Reporte de costos por ruta
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Analisis de costos

  # ===== NOTIFICACIONES =====
  /api/notifications/send:
    post:
      tags: [Usuarios]
      summary: Enviar notificacion (email/SMS)
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                to:
                  type: string
      responses:
        '200':
          description: Notificacion enviada

  /api/notifications/custom:
    post:
      tags: [Usuarios]
      summary: Enviar notificacion personalizada
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Notificacion enviada

  /api/notifications/test:
    post:
      tags: [Usuarios]
      summary: Enviar notificacion de prueba
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Prueba enviada

  /api/notifications/config:
    get:
      tags: [Usuarios]
      summary: Configuracion de notificaciones
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Configuracion actual

  # ===== MANTENIMIENTO =====
  /api/mantenimiento/unidades:
    get:
      tags: [Vehiculos]
      summary: Unidades de mantenimiento
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de unidades

  /api/mantenimiento/ots:
    get:
      tags: [Vehiculos]
      summary: Ordenes de trabajo de mantenimiento
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de OTs

  # ===== SAAS ADMIN =====
  /api/saas/global-stats:
    get:
      tags: [SuperAdmin]
      summary: Estadisticas globales SaaS
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Stats globales

  /api/saas/cobros:
    get:
      tags: [SuperAdmin]
      summary: Cobros y pagos globales
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de cobros

  /api/saas/cobros/resumen:
    get:
      tags: [SuperAdmin]
      summary: Resumen de cobros
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Resumen

  /api/saas/suscripciones:
    get:
      tags: [SuperAdmin]
      summary: Suscripciones globales
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de suscripciones

  /api/saas/audit:
    get:
      tags: [SuperAdmin]
      summary: Auditoria global
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Log de auditoria

  /api/saas/config:
    get:
      tags: [SuperAdmin]
      summary: Configuracion SaaS
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Configuracion

  /api/saas/planes:
    get:
      tags: [SuperAdmin]
      summary: Planes SaaS
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de planes

  /api/saas/revenue-chart:
    get:
      tags: [SuperAdmin]
      summary: Grafica de revenue
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Datos de revenue

  /api/saas/all-pedidos:
    get:
      tags: [SuperAdmin]
      summary: Todos los pedidos globales
