openapi: 3.0.3
info:
  title: Last Mile Delivery Platform API
  description: |
    API REST para la plataforma SaaS de last mile delivery multi-pais.
    Multi-tenant con autenticacion JWT, facturacion fiscal multi-pais (MX/BR/CO/AR/CL/PE/UY/EC),
    pagos Stripe/MercadoPago, i18n (ES/EN/PT), notificaciones multi-idioma, PWA chofer.
  version: 4.0.0
  contact:
    name: Last Mile Support
    email: soporte@lastmile.mx
  license:
    name: Proprietary

servers:
  - url: https://lastmile-platform.onrender.com
    description: Production
  - url: http://localhost:8080
    description: Development

tags:
  - name: Auth
    description: Autenticacion y tokens
  - name: Health
    description: Health checks
  - name: Pedidos
    description: Gestion de pedidos/envios
  - name: Zonas
    description: Zonas y tarifas
  - name: Choferes
    description: Gestion de choferes
  - name: Vehiculos
    description: Gestion de vehiculos
  - name: Clientes
    description: Clientes del tenant
  - name: Billing
    description: Facturacion SaaS y planes
  - name: CFDI
    description: Facturacion electronica CFDI 4.0
  - name: Fiscal
    description: Sistema fiscal multi-pais (MX, BR, CO, AR, CL, PE, UY, EC)
  - name: Pagos
    description: Pagos y transacciones multi-pais
  - name: Webhooks
    description: Webhooks de Stripe y MercadoPago
  - name: Usuarios
    description: Gestion de usuarios del tenant
  - name: SuperAdmin
    description: Gestion global de tenants (solo superadmin)
  - name: Tracking
    description: Tracking publico para clientes finales
  - name: Referidos
    description: Sistema de referidos
  - name: Tickets
    description: Sistema de soporte/tickets
  - name: Debug
    description: Herramientas de debug (solo superadmin)
  - name: Gamification
    description: Gamificacion y leaderboard de choferes
  - name: ReverseLogistics
    description: Logistica inversa y devoluciones
  - name: COD
    description: Contra entrega y conciliacion
  - name: Settlements
    description: Conciliacion de cobros y depositos de choferes
  - name: Analytics
    description: Analiticas predictivas y rendimiento

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check del sistema
      security: []
      responses:
        '200':
          description: Sistema operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, pass]
              properties:
                user:
                  type: string
                  example: admin
                pass:
                  type: string
                  example: admin123
                emp_id:
                  type: integer
                  description: ID de empresa (opcional, para multi-tenant)
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refrescar access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Nuevo access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  expires_in:
                    type: integer
        '401':
          description: Refresh token invalido

  /api/pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos del tenant
      security:
        - bearerAuth: []
      parameters:
        - name: limite
          in: query
          schema:
            type: integer
            default: 100
        - name: estado
          in: query
          schema:
            type: string
            enum: [PENDIENTE, ASIGNADO, RECOGIENDO, EN_RUTA, ENTREGADO, CANCELADO]
      responses:
        '200':
          description: Lista de pedidos
    post:
      tags: [Pedidos]
      summary: Crear un pedido/envio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
      responses:
        '200':
          description: Pedido creado

  /api/pedidos/{ped_id}:
    get:
      tags: [Pedidos]
      summary: Obtener pedido por ID
      security: [{bearerAuth: []}]
      parameters:
        - name: ped_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido encontrado
    put:
      tags: [Pedidos]
      summary: Actualizar pedido
      security: [{bearerAuth: []}]
      parameters:
        - name: ped_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Pedido actualizado
    delete:
      tags: [Pedidos]
      summary: Eliminar un pedido
      security:
        - bearerAuth: []
      parameters:
        - name: ped_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido eliminado

  /api/zonas:
    get:
      tags: [Zonas]
      summary: Listar zonas del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de zonas
    post:
      tags: [Zonas]
      summary: Crear zona
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                coordenadas:
                  type: string
      responses:
        '200':
          description: Zona creada

  /api/zonas/cotizar:
    post:
      tags: [Zonas]
      summary: Cotizar envio por zona
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zona_id:
                  type: integer
                servicio:
                  type: string
                  enum: [ESTANDAR, EXPRESS, SAME_DAY]
                peso_kg:
                  type: number
                distancia_km:
                  type: number
                valor_declarado:
                  type: number
      responses:
        '200':
          description: Cotizacion

  /api/choferes:
    get:
      tags: [Choferes]
      summary: Listar choferes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de choferes
    post:
      tags: [Choferes]
      summary: Crear chofer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoferCreate'
      responses:
        '200':
          description: Chofer creado

  /api/choferes/{cho_id}:
    put:
      tags: [Choferes]
      summary: Actualizar chofer
      security: [{bearerAuth: []}]
      parameters:
        - name: cho_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoferCreate'
      responses:
        '200':
          description: Chofer actualizado
    delete:
      tags: [Choferes]
      summary: Eliminar chofer
      security:
        - bearerAuth: []
      parameters:
        - name: cho_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chofer eliminado

  /api/vehiculos:
    get:
      tags: [Vehiculos]
      summary: Listar vehiculos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de vehiculos
    post:
      tags: [Vehiculos]
      summary: Crear vehiculo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
      responses:
        '200':
          description: Vehiculo creado

  /api/vehiculos/{veh_id}:
    put:
      tags: [Vehiculos]
      summary: Actualizar vehiculo
      security: [{bearerAuth: []}]
      parameters:
        - name: veh_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
      responses:
        '200':
          description: Vehiculo actualizado
    delete:
      tags: [Vehiculos]
      summary: Eliminar vehiculo
      security:
        - bearerAuth: []
      parameters:
        - name: veh_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vehiculo eliminado

  /api/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes
    post:
      tags: [Clientes]
      summary: Crear cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '200':
          description: Cliente creado

  /api/clientes/{cli_id}:
    put:
      tags: [Clientes]
      summary: Actualizar cliente
      security: [{bearerAuth: []}]
      parameters:
        - name: cli_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '200':
          description: Cliente actualizado
    delete:
      tags: [Clientes]
      summary: Eliminar cliente
      security:
        - bearerAuth: []
      parameters:
        - name: cli_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente eliminado

  /api/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
    post:
      tags: [Usuarios]
      summary: Crear usuario
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, nombre, password]
              properties:
                usuario:
                  type: string
                nombre:
                  type: string
                password:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                rol:
                  type: string
                  enum: [admin, operacion, chofer, cliente]
      responses:
        '200':
          description: Usuario creado

  /api/usuarios/{usu_id}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por ID
      security: [{bearerAuth: []}]
      parameters:
        - name: usu_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      security: [{bearerAuth: []}]
      parameters:
        - name: usu_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        '200':
          description: Usuario actualizado
    delete:
      tags: [Usuarios]
      summary: Eliminar usuario
      security:
        - bearerAuth: []
      parameters:
        - name: usu_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado

  /api/billing/planes:
    get:
      tags: [Billing]
      summary: Listar planes disponibles
      security: []
      responses:
        '200':
          description: Lista de planes

  /api/billing/mis-limites:
    get:
      tags: [Billing]
      summary: Ver limites del plan actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Limites del tenant

  /api/billing/stats:
    get:
      tags: [Billing]
      summary: Estadisticas de uso del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadisticas

  /api/billing/webhook/stripe:
    post:
      tags: [Billing]
      summary: Webhook de Stripe (verificado por firma)
      security: []
      responses:
        '200':
          description: Webhook procesado

  /api/cfdi/status:
    get:
      tags: [CFDI]
      summary: Estado del servicio de facturacion
      security: []
      responses:
        '200':
          description: Estado CFDI

  /api/cfdi/facturas:
    get:
      tags: [CFDI]
      summary: Listar facturas emitidas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de facturas
    post:
      tags: [CFDI]
      summary: Crear factura CFDI
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                formaPago:
                  type: string
                metodoPago:
                  type: string
                subtotal:
                  type: number
                iva:
                  type: number
                total:
                  type: number
                receptorRfc:
                  type: string
                receptorRazon:
                  type: string
                pedId:
                  type: integer
      responses:
        '200':
          description: Factura creada

  /api/cfdi/facturas/{fac_id}/cancelar:
    post:
      tags: [CFDI]
      summary: Cancelar factura
      security:
        - bearerAuth: []
      parameters:
        - name: fac_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
      responses:
        '200':
          description: Factura cancelada

  /api/pagos/transacciones:
    get:
      tags: [Pagos]
      summary: Listar transacciones de pago
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de transacciones
    post:
      tags: [Pagos]
      summary: Crear transaccion de pago
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pedId:
                  type: integer
                facId:
                  type: integer
                numReferencia:
                  type: string
                monto:
                  type: number
                moneda:
                  type: string
                metodo:
                  type: string
                estatus:
                  type: string
      responses:
        '200':
          description: Transaccion creada

  /api/pagos/transacciones/{pag_id}:
    delete:
      tags: [Pagos]
      summary: Eliminar transaccion
      security:
        - bearerAuth: []
      parameters:
        - name: pag_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaccion eliminada

  /api/billing/cancelar:
    post:
      tags: [Billing]
      summary: Cancelar suscripcion SaaS
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suscripcion cancelada

  /api/onboarding/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo tenant con admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Tenant registrado

  /api/saas/tenants:
    get:
      tags: [SuperAdmin]
      summary: Listar todos los tenants (solo superadmin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tenants
    post:
      tags: [SuperAdmin]
      summary: Crear nuevo tenant (solo superadmin)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                rfc:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                plan:
                  type: string
                admin_user:
                  type: string
                admin_pass:
                  type: string
      responses:
        '200':
          description: Tenant creado

  /api/saas/tenants/{emp_id}/suspend:
    post:
      tags: [SuperAdmin]
      summary: Suspender tenant (solo superadmin)
      security:
        - bearerAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant suspendido

  /api/saas/tenants/{emp_id}/activate:
    post:
      tags: [SuperAdmin]
      summary: Activar tenant (solo superadmin)
      security:
        - bearerAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant activado

  /api/tracking/{token}:
    get:
      tags: [Tracking]
      summary: Obtener estado del pedido por token de tracking
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del pedido

  # ===== MULTI-COUNTRY FISCAL =====
  /api/fiscal/countries:
    get:
      tags: [Fiscal]
      summary: Listar paises con soporte fiscal
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de 8 paises (MX, BR, CO, AR, CL, PE, UY, EC)

  /api/fiscal/providers:
    get:
      tags: [Fiscal]
      summary: Listar proveedores fiscales disponibles
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Proveedores con monedas

  /api/fiscal/config:
    get:
      tags: [Fiscal]
      summary: Obtener configuracion fiscal del tenant
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Configuracion fiscal
    put:
      tags: [Fiscal]
      summary: Guardar configuracion fiscal del tenant
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code]
              properties:
                country_code:
                  type: string
                  enum: [MX, BR, CO, AR, CL, PE, UY, EC]
                api_key:
                  type: string
                api_secret:
                  type: string
                base_url:
                  type: string
      responses:
        '200':
          description: Configuracion guardada

  /api/fiscal/test-connection:
    post:
      tags: [Fiscal]
      summary: Probar conexion con proveedor fiscal
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
      responses:
        '200':
          description: Resultado de prueba de conexion

  /api/fiscal/emit:
    post:
      tags: [Fiscal]
      summary: Emitir documento fiscal
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Documento emitido

  /api/fiscal/cancel:
    post:
      tags: [Fiscal]
      summary: Cancelar documento fiscal
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Documento cancelado

  /api/system/migrate:
    post:
      tags: [Fiscal]
      summary: Ejecutar migracion de tablas fiscales (admin)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Migracion ejecutada

  # ===== MULTI-COUNTRY PAYMENTS =====
  /api/payment/countries:
    get:
      tags: [Pagos]
      summary: Listar paises con metodos de pago
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de paises con pagos

  /api/payment/methods/{country_code}:
    get:
      tags: [Pagos]
      summary: Metodos de pago por pais
      security: [{bearerAuth: []}]
      parameters:
        - name: country_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metodos de pago del pais

  /api/payments/create:
    post:
      tags: [Pagos]
      summary: Crear pago multi-pais
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, country_code]
              properties:
                amount:
                  type: number
                country_code:
                  type: string
                payment_method:
                  type: string
                description:
                  type: string
                order_id:
                  type: string
      responses:
        '200':
          description: Sesion de pago creada

  /api/payments/status/{provider}/{payment_id}:
    get:
      tags: [Pagos]
      summary: Consultar estado de pago
      security: [{bearerAuth: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe, mercadopago]
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del pago

  /api/payments/refund:
    post:
      tags: [Pagos]
      summary: Reembolsar pago
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, payment_id]
              properties:
                provider:
                  type: string
                payment_id:
                  type: string
                amount:
                  type: number
      responses:
        '200':
          description: Reembolso procesado

  /api/payments/status-summary:
    get:
      tags: [Pagos]
      summary: Estado de configuracion de proveedores de pago
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Resumen de estado

  # ===== WEBHOOKS (PUBLIC - NO AUTH) =====
  /api/webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Webhook de Stripe (pagos, reembolsos, etc)
      security: []
      responses:
        '200':
          description: Evento procesado

  /api/webhooks/mercadopago:
    post:
      tags: [Webhooks]
      summary: Webhook de MercadoPago (pagos, etc)
      security: []
      responses:
        '200':
          description: Evento procesado

  # ===== ANALYTICS =====
  /api/analytics/multi-country:
    get:
      tags: [Fiscal]
      summary: Analytics multi-pais (fiscal, pagos, ordenes)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Datos analiticos multi-pais
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
