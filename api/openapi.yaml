components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT del login

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [OK, DEGRADED]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        database:
          type: object
          properties:
            engine:
              type: string
            status:
              type: string
            latency:
              type: string
        services:
          type: object
          properties:
            stripe:
              type: string
            mercadopago:
              type: string
            rate_limit:
              type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 43200
        data:
          type: object
          properties:
            emp_id:
              type: integer
            usuario:
              type: string
            nombre:
              type: string
            rol:
              type: string
            empresa:
              type: string

    PedidoCreate:
      type: object
      required: [pedNumero, clienteNombre, clienteTelefono, destinoDir]
      properties:
        pedNumero:
          type: string
        clienteNombre:
          type: string
        clienteTelefono:
          type: string
        clienteEmail:
          type: string
        destinoDir:
          type: string
        destinoCol:
          type: string
        destinoCiudad:
          type: string
        destinoCp:
          type: string
        pesoKg:
          type: number
        bultos:
          type: integer
        largoCm:
          type: number
        anchoCm:
          type: number
        altoCm:
          type: number
        costoTotal:
          type: number
        formaPago:
          type: string
          enum: [EFECTIVO, TARJETA, TRANSFERENCIA, OXXO]
        prioridad:
          type: string
          enum: [NORMAL, URGENTE, EXPRESS]
        notas:
          type: string

    ChoferCreate:
      type: object
      required: [nombre, telefono]
      properties:
        nombre:
          type: string
        telefono:
          type: string
        email:
          type: string
        licencia:
          type: string

    VehiculoCreate:
      type: object
      required: [placa, tipo]
      properties:
        placa:
          type: string
        tipo:
          type: string
        marca:
          type: string
        modelo:
          type: string
        color:
          type: string
        capacidad_kg:
          type: number

    ClienteCreate:
      type: object
      required: [nombre, telefono]
      properties:
        nombre:
          type: string
        telefono:
          type: string
        email:
          type: string
        direccion:
          type: string

    RegisterRequest:
      type: object
      required: [empresa, usuario]
      properties:
        empresa:
          type: object
          required: [nombre, rfc]
          properties:
            nombre:
              type: string
            rfc:
              type: string
        usuario:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              description: Min 8 chars, 1 uppercase, 1 lowercase, 1 digit
        plan:
          type: string
          enum: [STARTER, PRO, ENTERPRISE]
          default: STARTER
