name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'sql/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          cd api
          flake8 server.py --max-line-length=120 --ignore=E501,W503,E402

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lastmile
          POSTGRES_PASSWORD: lastmile_test
          POSTGRES_DB: lastmile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run migration
        env:
          DATABASE_URL: postgresql://lastmile:lastmile_test@localhost:5432/lastmile_test
        run: |
          psql $DATABASE_URL -f sql/migrate.sql || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://lastmile:lastmile_test@localhost:5432/lastmile_test?sslmode=disable
          FLASK_ENV: testing
          FLASK_SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
        run: |
          cd api
          timeout 10 python -c "
          import os
          os.environ['DATABASE_URL'] = os.environ.get('DATABASE_URL', 'sqlite:///test.db')
          from server import app
          print('Server imports OK')
          print('Endpoints:', len(app.url_map._rules))
          "

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://lastmile:lastmile_test@localhost:5432/lastmile_test?sslmode=disable
          FLASK_ENV: testing
        run: |
          cd api
          python -m pytest tests/ -v --tb=short --co -q 2>/dev/null || python -m pytest tests/ -v --tb=short -x
